  --tx:#17233d; --tx2:#4d5b76; --tx3:#8a95ab;
  --rose:#c4507c; --rosegold:#c9701a; --lav:#1f5bb5; --mauve:#b0477a; --cream:#6e4c43;
  --navy:#164a8a; --orange:#e8841a;
  --late:#d23c55; --today:#c9701a; --wait:#1f5bb5; --ok:#2e8f5f;
  --surface:#ffffff; --surface2:#ffffff; --input:rgba(22,58,120,.045); --scrim:rgba(20,32,60,.28);
  --topbar:rgba(255,255,255,.9); --glow1:rgba(243,147,36,.14); --glow2:rgba(196,80,124,.1);
  --tint-rose:rgba(196,80,124,.09); --tint-lav:rgba(31,91,181,.08); --tint-gold:rgba(232,132,26,.1); --tint-late:rgba(210,60,85,.08);
  --shadow:0 1px 2px rgba(22,58,120,.06), 0 10px 26px -18px rgba(22,58,120,.3);
  --shadow-lg:0 30px 70px -28px rgba(22,58,120,.4);
  --note-f:none;
  --c0:#1F5BB5; --c1:#D46F18; --c2:#7A5BC7; --c3:#C2477A;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .35s,color .35s}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
::selection{background:rgba(233,184,191,.35)}
.glow{position:fixed;pointer-events:none;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0}
.g1{width:560px;height:560px;left:-180px;top:-220px;background:radial-gradient(circle,var(--glow1),transparent 70%)}
.g2{width:640px;height:640px;right:-240px;bottom:-280px;background:radial-gradient(circle,var(--glow2),transparent 70%)}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:12;background:var(--topbar);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:12px 28px 0}
.top-row{display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.spark{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(140deg,rgba(233,184,191,.3),rgba(191,174,230,.2));color:var(--rose);font-size:15px;box-shadow:0 0 22px -6px rgba(233,184,191,.5)}
.brand b{display:block;font-family:var(--serif);font-weight:500;font-size:17px;letter-spacing:.1px;line-height:1.2}
.brand small{display:block;color:var(--tx3);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;width:260px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--tx3);transition:border-color .2s,width .3s var(--ease)}
.search:focus-within{border-color:rgba(233,184,191,.5);width:320px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font-size:14px}
.search input::placeholder{color:var(--tx3)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);color:var(--tx2);font-size:15px;transition:all .2s}
.icon-btn:hover{color:var(--tx);border-color:var(--line2);background:var(--panel2)}
.add-btn{display:flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:12px;background:linear-gradient(135deg,#f39324,#e07a12);color:#fff;font-weight:600;font-size:14px;box-shadow:0 8px 22px -10px rgba(243,147,36,.65);transition:transform .2s var(--ease),box-shadow .2s;white-space:nowrap}
.add-btn:hover{transform:translateY(-1px);box-shadow:0 12px 26px -10px rgba(217,160,180,.85)}
kbd{font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.12);font-weight:500}
nav{display:flex;justify-content:center;gap:4px;padding:10px 0 12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.nav-i{flex:none;display:flex;align-items:center;gap:8px;height:36px;padding:0 15px;border-radius:20px;color:var(--tx2);font-size:14px;transition:background .2s,color .2s,box-shadow .2s}
.nav-i:hover{background:var(--panel);color:var(--tx)}
.nav-i.on{background:var(--panel2);color:var(--tx);box-shadow:var(--shadow),0 0 0 1px var(--line2)}
.nav-i .ic{color:var(--tx3);font-size:13px}
.nav-i.on .ic{color:var(--rose)}
.nav-i .n{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
.nav-i .n.hot{color:#2a1a22;background:var(--rose);border-radius:20px;padding:0 7px;font-weight:500}
#saveState{position:fixed;left:18px;bottom:14px;z-index:5;font-size:12px;color:var(--tx3);pointer-events:none}

main{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:34px 28px 120px}
.v-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:6px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:400;font-size:40px;line-height:1.1;margin:0;letter-spacing:-.4px}
h1 em{font-style:italic;color:var(--rose)}
.v-sub{color:var(--tx2);margin:8px 0 0;font-size:14.5px}
.help-btn{font-size:12.5px;color:var(--tx3);padding:6px 11px;border-radius:20px;border:1px solid var(--line);transition:all .2s}
.help-btn:hover,.help-btn.on{color:var(--tx);border-color:var(--line2);background:var(--panel)}
.help{margin:16px 0 4px;padding:16px 18px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);color:var(--tx2);font-size:14px;animation:fade .3s var(--ease);max-width:900px}
.help b{color:var(--tx);font-weight:600}
.help p{margin:0 0 8px}.help p:last-child{margin:0}
.summary{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:18px 0 6px;font-size:15px;color:var(--tx2)}
.summary .lbl{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tx3);margin-right:4px}
.summary b{font-family:var(--mono);font-weight:500;color:var(--tx);font-size:16px}
.summary .dot{color:var(--tx3)}
.pill-late{font-size:12.5px;padding:2px 10px;border-radius:20px;background:var(--tint-late);color:var(--late)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 0;padding:12px 16px;border-radius:12px;background:var(--tint-lav);color:var(--tx2);font-size:13.5px}
.banner button{margin-left:auto;color:var(--lav);font-weight:500;font-size:13.5px}

/* rejillas para aprovechar el ancho */
.hoy-grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:32px;align-items:start}
.col-side{position:sticky;top:132px;display:flex;flex-direction:column;gap:22px;padding-top:34px}
.secgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(460px,1fr));gap:0 30px;align-items:start}
.narrow{max-width:920px}

/* ---------- secciones y tarjetas ---------- */
.sec{margin-top:34px;animation:fade .35s var(--ease)}
.sec-h{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-h h3{margin:0;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tx2);font-weight:600}
.sec-h .cnt{font-family:var(--mono);font-size:12px;color:var(--tx3)}
.sec-h .x{margin-left:auto}
.sec-note{color:var(--tx3);font-size:13px;margin:-6px 0 12px}
.list{display:flex;flex-direction:column;gap:8px}
.sub-h{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px 4px;font-family:var(--serif);font-size:17px;color:var(--cream)}
.sub-h span{font-family:var(--mono);font-size:12px;color:var(--tx3)}
.sub-h:first-child{margin-top:0}
.card{position:relative;display:flex;align-items:flex-start;gap:14px;padding:14px 14px 14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(6px);transition:background .2s,border-color .2s,transform .25s var(--ease),opacity .3s}
.card:hover{background:var(--panel2);border-color:var(--line2)}
.card.leaving,.note.leaving,.rn-li.leaving{opacity:0;transform:translateX(18px) scale(.98);transition:all .35s var(--ease)}
.card.hecho .ctitle{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--line2)}
.check{flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;transition:all .25s var(--ease)}
.check svg{width:13px;height:13px;fill:none;stroke:#2a1a22;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .3s var(--ease) .05s}
.check:hover{border-color:var(--rose);box-shadow:0 0 0 4px var(--tint-rose)}
.card.hecho .check,.card.leaving .check,.rn-li.leaving .check{background:var(--rose);border-color:var(--rose)}
.card.hecho .check svg,.card.leaving .check svg,.rn-li.leaving .check svg{stroke-dashoffset:0}
.cbody{flex:1;min-width:0;cursor:pointer}
.ctitle{font-size:15px;color:var(--tx);font-weight:500;line-height:1.4;word-wrap:break-word}
.star{color:var(--rose);font-size:12px;margin-right:6px;vertical-align:1px}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px;font-size:12.5px;color:var(--tx3)}
.role{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:500}
.role.hacer{background:var(--tint-rose);color:var(--rose)}
.role.recordar{background:var(--tint-gold);color:var(--today)}
.role.gabriel{background:var(--tint-rose);color:var(--mauve)}
.role.decision{background:var(--tint-lav);color:var(--mauve)}
.role.seguimiento{background:var(--tint-lav);color:var(--lav)}
.role.verificar{background:var(--tint-lav);color:var(--lav)}
.role.escalar{background:var(--tint-late);color:var(--late)}
.role.rapida{background:var(--tint-gold);color:var(--cream)}
.m{display:inline-flex;align-items:center;gap:6px}
.date i{width:6px;height:6px;border-radius:50%;background:var(--tx3)}
.date.late{color:var(--late)}.date.late i{background:var(--late);box-shadow:0 0 8px var(--late)}
.date.today{color:var(--today)}.date.today i{background:var(--today);box-shadow:0 0 8px var(--today)}
.m.wait{color:var(--wait)}
.src{cursor:pointer;border-bottom:1px dotted transparent;transition:color .2s}
.src:hover{color:var(--tx2);border-bottom-color:var(--tx3)}
.tchip{color:var(--lav);cursor:pointer}
.tchip:hover{color:var(--tx)}
.acts{display:flex;gap:4px;opacity:0;transform:translateX(4px);transition:all .2s var(--ease);flex:none;align-self:center}
.card:hover .acts,.card:focus-within .acts{opacity:1;transform:none}
@media (hover:none){.acts{opacity:1;transform:none}}
.act{height:30px;padding:0 10px;border-radius:9px;font-size:12.5px;color:var(--tx2);background:var(--panel2);border:1px solid var(--line);white-space:nowrap;transition:all .2s}
.act:hover{background:var(--panel3);color:var(--tx)}
.act.pri{color:var(--ok)}
.empty{margin-top:34px;padding:36px 28px;border-radius:20px;text-align:center;background:var(--panel);border:1px solid var(--line);animation:fade .4s var(--ease)}
.empty .big{font-family:var(--serif);font-size:24px;color:var(--cream);margin-bottom:6px}
.empty p{color:var(--tx2);margin:0 auto;max-width:440px}
.empty .next{margin-top:18px;font-size:13.5px;color:var(--tx3)}
.empty .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.btn{height:38px;padding:0 16px;border-radius:11px;font-size:14px;background:var(--panel2);border:1px solid var(--line);color:var(--tx);transition:all .2s}
.btn:hover{background:var(--panel3);border-color:var(--line2)}
.btn.primary{background:linear-gradient(135deg,#1f5bb5,#164a8a);color:#fff;border:0;font-weight:600}
.btn.small{height:30px;padding:0 12px;font-size:12.5px;border-radius:9px}
.btn.danger{color:var(--late)}
details.wait-box{margin-top:34px}
details.wait-box summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);color:var(--tx2);font-size:14px;transition:background .2s}
details.wait-box summary::-webkit-details-marker{display:none}
details.wait-box summary:hover{background:var(--panel2)}
details.wait-box summary .chev{margin-left:auto;color:var(--tx3);transition:transform .25s}
details.wait-box[open] summary .chev{transform:rotate(90deg)}
details.wait-box .list{margin-top:8px}
.stat{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.stat div{padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);min-width:140px}
.stat b{display:block;font-family:var(--mono);font-size:24px;font-weight:500;color:var(--cream)}
.stat span{font-size:12.5px;color:var(--tx3)}

/* ---------- columna lateral de Hoy ---------- */
.side-card{border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 16px 12px}
.side-card h4{margin:0 0 10px;font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:8px}
.side-card h4 .x{margin-left:auto;text-transform:none;letter-spacing:0}
.sn-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 6px;border-radius:10px;text-align:left;transition:background .2s}
.sn-row:hover{background:var(--panel2)}
.sn-row b{font-weight:500;font-size:14px;flex:none}
.sn-row span{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--tx3);white-space:nowrap}
.gab-li{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:background .2s}
.gab-li:hover{background:var(--panel2)}
.gab-li .ic{flex:none;width:18px;text-align:center}
.gab-li small{display:block;color:var(--tx3);font-size:12px}
.more{display:block;width:100%;text-align:center;padding:8px 0 2px;font-size:12.5px;color:var(--tx3)}
.more:hover{color:var(--tx)}

/* post-it de rápidas */
.rnote{position:relative;padding:22px 18px 14px;border-radius:4px 4px 16px 4px;background:var(--n-rapida);color:var(--note-tx);box-shadow:0 14px 26px -16px rgba(0,0,0,.55),0 2px 0 rgba(0,0,0,.04);transform:rotate(-.6deg);filter:var(--note-f)}
.rnote h4{margin:0 0 8px;font-family:var(--hand);font-size:26px;font-weight:600;line-height:1;color:var(--note-tx)}
.rn-li{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px dashed rgba(59,42,52,.16);font-size:14px}
.rn-li:last-of-type{border-bottom:0}
.rn-li .check{width:19px;height:19px;border-color:rgba(59,42,52,.35)}
.rn-li span{flex:1;cursor:pointer}
.rn-li small{color:var(--note-tx2);font-size:12px;white-space:nowrap}
.rn-add{width:100%;margin-top:8px;background:rgba(255,255,255,.45);border:1px dashed rgba(59,42,52,.25);border-radius:9px;padding:7px 10px;outline:0;color:var(--note-tx);font-size:13.5px}
.rn-add::placeholder{color:var(--note-tx2)}
.tape{position:absolute;top:-9px;left:50%;width:78px;height:20px;margin-left:-39px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.35);transform:rotate(-2deg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
:root:not([data-theme="light"]) .tape{background:rgba(255,255,255,.28)}

/* ---------- tablero kanban ---------- */
.b-filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:20px 0 4px}
.b-filters .inp{width:230px;height:34px}
.board{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2.1fr) minmax(230px,1fr) minmax(230px,1fr);gap:18px;margin-top:18px;align-items:start}
.col[data-col="pendiente"] .col-b{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));align-content:start;gap:16px 14px}
.col{border-radius:20px;background:var(--panel);border:1px solid var(--line);padding:14px 12px 16px;min-height:340px;transition:background .2s,border-color .2s,box-shadow .2s}
.col.over{border-color:rgba(233,184,191,.6);background:var(--tint-rose);box-shadow:0 0 0 4px var(--tint-rose)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 6px 12px}
.col-h b{font-family:var(--serif);font-weight:500;font-size:18px}
.col-h span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--tx3);background:var(--panel2);border-radius:20px;padding:1px 9px}
.col-b{display:flex;flex-direction:column;gap:14px;min-height:260px}
.col-empty{margin:18px 6px;padding:22px 10px;border:1.5px dashed var(--line2);border-radius:14px;text-align:center;font-size:13px;color:var(--tx3)}
.note{position:relative;padding:18px 14px 12px;border-radius:3px 3px 14px 3px;color:var(--note-tx);background:var(--n-hacer);box-shadow:0 14px 22px -16px rgba(0,0,0,.6),0 1px 0 rgba(0,0,0,.05);cursor:grab;transition:transform .25s var(--ease),box-shadow .25s,opacity .3s;filter:var(--note-f)}
.note:nth-child(3n+1){transform:rotate(-.9deg)}
.note:nth-child(3n+2){transform:rotate(.7deg)}
.note:nth-child(3n){transform:rotate(-.3deg)}
.note:hover{transform:rotate(0) translateY(-3px);box-shadow:0 22px 30px -18px rgba(0,0,0,.65)}
.note.dragging{opacity:.45}
.note .tape{width:56px;margin-left:-28px;height:16px;top:-7px}
.n-top{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.2px;color:var(--note-tx2);text-transform:uppercase}
.n-top .star{margin:0 0 0 auto;color:#b0485e}
.n-title{margin-top:6px;font-size:15px;font-weight:500;line-height:1.35;cursor:pointer;word-wrap:break-word}
.n-meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:9px;font-size:12px;color:var(--note-tx2)}
.n-meta .late{color:#b0304a;font-weight:600}
.n-meta .today{color:#8a5a00;font-weight:600}
.n-check{position:absolute;right:10px;bottom:10px;width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(59,42,52,.3);display:grid;place-items:center;font-size:13px;color:var(--note-tx);opacity:0;transition:all .2s}
.note:hover .n-check{opacity:1}
@media (hover:none){.n-check{opacity:1}}
.n-check:hover{background:rgba(255,255,255,.6)}
.note.hecho .n-title{text-decoration:line-through;text-decoration-color:rgba(59,42,52,.35);opacity:.7}
.n-hacer{background:var(--n-hacer)}.n-recordar{background:var(--n-recordar)}.n-gabriel{background:var(--n-gabriel)}.n-decision{background:var(--n-decision)}
.n-seguimiento{background:var(--n-seguimiento)}.n-verificar{background:var(--n-verificar)}.n-escalar{background:var(--n-escalar)}.n-rapida{background:var(--n-rapida)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:12px;color:var(--tx3)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;filter:var(--note-f)}

/* ---------- muro de temas ---------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px;margin-top:6px}
.tnote{position:relative;padding:20px 16px 14px;border-radius:3px 3px 16px 3px;color:var(--note-tx);background:var(--n-senal);box-shadow:0 16px 24px -18px rgba(0,0,0,.6);cursor:pointer;min-height:176px;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s;filter:var(--note-f)}
.tnote:nth-child(odd){transform:rotate(-.7deg)}
.tnote:nth-child(even){transform:rotate(.6deg)}
.tnote:hover{transform:rotate(0) translateY(-4px);box-shadow:0 24px 32px -20px rgba(0,0,0,.65)}
.tnote.domino{background:var(--n-domino)}.tnote.tema{background:var(--n-tema)}
.tnote .tape{width:60px;margin-left:-30px;height:16px;top:-7px}
.tn-h{display:flex;align-items:flex-start;gap:8px}
.tn-h b{font-family:var(--serif);font-weight:500;font-size:17px;line-height:1.25}
.tn-h .sem{margin-top:7px}
.tn-resp{font-size:12px;color:var(--note-tx2);margin-top:3px}
.tn-last{margin-top:10px;font-size:13px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tn-f{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--note-tx2)}
.sem{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex:none;display:inline-block}
.sem.verde{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sem.amarillo{background:var(--today);box-shadow:0 0 8px var(--today)}
.sem.rojo{background:var(--late);box-shadow:0 0 8px var(--late)}
.tnote .sem{width:10px;height:10px;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.tnote .sem.verde{background:#2f9a64}.tnote .sem.amarillo{background:#d49a1c}.tnote .sem.rojo{background:#d63b57}.tnote .sem:not(.verde):not(.amarillo):not(.rojo){background:rgba(59,42,52,.3)}
.st{display:grid;grid-template-columns:86px 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;color:var(--tx2);line-height:1.5}
.st:first-child{border-top:0}
.st-d{font-family:var(--mono);font-size:12px;color:var(--tx3);padding-top:2px}
.st .del{color:var(--tx3);opacity:0;font-size:12px;transition:opacity .2s}
.st:hover .del{opacity:1}
@media (hover:none){.st .del{opacity:.6}}
.t-row{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.t-row .inp{width:170px;height:34px}

/* reuniones */
.r-new{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.r-new input{height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);padding:0 14px;outline:0;transition:border-color .2s}
.r-new input:focus{border-color:rgba(233,184,191,.5)}
.r-new input[type=text]{flex:1;min-width:200px}
.r-card{border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;transition:border-color .2s}
.r-card.open{border-color:var(--line2)}
.r-top{display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer}
.r-top:hover{background:var(--panel)}
.r-date{flex:none;width:46px;text-align:center;padding:5px 0;border-radius:10px;background:var(--panel2)}
.r-date b{display:block;font-family:var(--mono);font-size:17px;font-weight:500;line-height:1.1}
.r-date span{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--tx3)}
.r-title{flex:1;min-width:0;font-weight:500}
.r-title small{display:block;font-weight:400;font-size:12.5px;color:var(--tx3);margin-top:2px}
.r-body{padding:4px 16px 16px;border-top:1px solid var(--line);animation:fade .25s var(--ease)}
.r-body label,.dlabel{display:block;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin:14px 0 6px}
.r-body textarea,.dtext{width:100%;min-height:90px;resize:vertical;border-radius:12px;background:var(--input);border:1px solid var(--line);padding:12px 14px;outline:0;line-height:1.55;font-size:14px}
.r-body textarea:focus,.dtext:focus{border-color:rgba(233,184,191,.45)}
.r-foot{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- panel de detalle ---------- */
#scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;z-index:30;background:var(--surface);border-left:1px solid var(--line2);box-shadow:-30px 0 60px -20px rgba(0,0,0,.45);transform:translateX(102%);transition:transform .38s var(--ease);overflow-y:auto;padding:22px 24px 40px}
.drawer.open{transform:none}
.d-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x-btn{margin-left:auto;width:32px;height:32px;border-radius:10px;color:var(--tx2);background:var(--panel2);border:1px solid var(--line)}
.x-btn:hover{color:var(--tx)}
.d-title{width:100%;background:none;border:0;outline:0;resize:none;font-family:var(--serif);font-size:23px;line-height:1.3;color:var(--tx);padding:4px 0;min-height:40px}
.principle{margin:10px 0 4px;padding:12px 14px;border-radius:12px;background:var(--tint-lav);font-size:13.5px;color:var(--tx2);display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.principle b{color:var(--tx);font-weight:500}
.fld{margin-top:18px}
.fld>span{display:block;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-bottom:7px}
.fld small{display:block;color:var(--tx3);font-size:12px;margin-top:6px}
.inp{width:100%;height:40px;border-radius:11px;background:var(--input);border:1px solid var(--line);padding:0 12px;outline:0;transition:border-color .2s}
.inp:focus{border-color:rgba(233,184,191,.5)}
.inp:disabled{opacity:.55}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5}
select.inp option{background:var(--surface);color:var(--tx)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:32px;padding:0 12px;border-radius:20px;font-size:13px;color:var(--tx2);background:var(--panel);border:1px solid var(--line);transition:all .2s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill:hover{color:var(--tx);border-color:var(--line2)}
.pill.on{background:var(--tint-rose);border-color:rgba(233,184,191,.55);color:var(--tx)}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:12px;background:var(--input);border:1px solid var(--line)}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:13px;color:var(--tx2);transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--panel3);color:var(--tx);box-shadow:var(--shadow)}
.d-foot{display:flex;align-items:center;gap:10px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--tx3)}
.d-foot .btn{margin-left:auto}
.d-mini{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;background:var(--panel);border:1px solid var(--line);cursor:pointer;font-size:13.5px;margin-top:6px}
.d-mini:hover{background:var(--panel2)}
.d-mini small{margin-left:auto;color:var(--tx3);font-size:12px;white-space:nowrap}

/* ---------- captura rápida ---------- */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 16px;background:var(--scrim);backdrop-filter:blur(4px);animation:fade .2s}
.m-card{width:640px;max-width:100%;border-radius:22px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-lg);padding:22px 22px 18px;animation:pop .3s var(--ease)}
.m-card>input{width:100%;background:none;border:0;outline:0;font-family:var(--serif);font-size:22px;color:var(--tx);padding:4px 2px 14px;border-bottom:1px solid var(--line)}
.m-card>input::placeholder{color:var(--tx3)}
.c-row{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
.c-lbl{width:74px;flex:none;font-size:12px;color:var(--tx3);letter-spacing:.4px}
.c-row .pills{flex:1}
.c-row .inp{flex:1;max-width:340px;height:36px}
.pill input[type=date]{background:none;border:0;outline:0;color:inherit;font-size:12.5px;width:118px}
.c-role{margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--tint-lav);font-size:13px;color:var(--tx2)}
.c-role b{color:var(--tx);font-weight:500}
.m-card details{margin-top:12px}
.m-card summary{cursor:pointer;color:var(--tx3);font-size:13px;list-style:none;display:inline-flex;gap:6px;align-items:center}
.m-card summary::-webkit-details-marker{display:none}
.m-card summary:hover{color:var(--tx2)}
.m-foot{display:flex;align-items:center;gap:8px;margin-top:18px}
.m-foot .hint{font-size:12px;color:var(--tx3);margin-right:auto}

/* ---------- menú y avisos ---------- */
.menu{position:fixed;top:62px;right:max(16px,calc((100vw - 1280px)/2 + 28px));z-index:35;width:310px;padding:8px;border-radius:16px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-lg);animation:pop .22s var(--ease)}
.menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--tx)}
.menu button small{color:var(--tx3);font-size:12px;margin-top:1px}
.menu button:hover{background:var(--panel2)}
.menu button.hero{background:var(--tint-rose)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.menu .foot{padding:6px 12px 4px;font-size:12px;color:var(--tx3)}
#toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:11px 16px;border-radius:14px;background:var(--surface2);border:1px solid var(--line2);box-shadow:var(--shadow-lg);font-size:14px;animation:up .3s var(--ease)}
.toast button{color:var(--rose);font-weight:600;font-size:13.5px}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
.fab{display:none}

@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- pantallas medianas y celular ---------- */
@media (max-width:1180px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:1040px){
  .hoy-grid{grid-template-columns:1fr}
  .col-side{position:static;padding-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .secgrid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .top-in{padding:10px 16px 0}
  .brand small,.add-btn{display:none}
  .top-row{flex-wrap:wrap}
  .search,.search:focus-within{order:9;width:100%}
  nav{justify-content:flex-start;margin:0 -16px;padding:10px 16px 10px}
  main{padding:24px 16px 120px}
  h1{font-size:30px}
  .board{grid-template-columns:1fr}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:22px;z-index:15;width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,#eebdc5,#d9a0b4);color:#2a1a22;font-size:26px;box-shadow:0 14px 30px -10px rgba(217,160,180,.7)}
  .menu{left:12px;right:12px;width:auto}
  .modal{padding:6vh 12px 12px}
  .row2{grid-template-columns:1fr}
  .c-lbl{width:100%}
  #saveState{display:none}
}
.icon-btn.s-only{display:none}
@media (max-width:760px) and (hover:none){.acts{width:100%;justify-content:flex-end}.card{flex-wrap:wrap}}
/* ================= v4: dashboard, agenda y líderes ================= */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:22px 0 4px}
.kbox{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 16px 12px;border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;transition:background .2s,border-color .2s,transform .2s var(--ease)}
.kbox:hover{background:var(--panel2);border-color:var(--line2);transform:translateY(-1px)}
.kbox .kl{display:flex;align-items:center;gap:7px;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3)}
.kbox b{font-family:var(--mono);font-weight:500;font-size:30px;line-height:1.15;color:var(--tx)}
.kbox small{font-size:12px;color:var(--tx3)}
.kbox.zero b{color:var(--tx3)}
.sem.lav{background:var(--wait);box-shadow:0 0 8px var(--wait)}
.cleanup{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding:12px 16px;border-radius:14px;background:var(--tint-late);color:var(--tx2);font-size:13.5px}
.cleanup button{margin-left:auto;color:var(--late);font-weight:600;font-size:13.5px}
.tl{display:grid;grid-template-columns:58px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);transition:background .2s}
.tl:hover{background:var(--panel2)}
.tl-h{font-family:var(--mono);font-size:13px;color:var(--tx2)}
.tl-b{cursor:pointer;min-width:0}
.tl-b b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-b small{color:var(--tx3);font-size:12px}
.tl.past{opacity:.55}.tl.now{border-color:rgba(233,184,191,.55);box-shadow:0 0 0 3px var(--tint-rose)}
.tl.now .tl-h{color:var(--rose)}
.tl.bloque{background:none;border-style:dashed}
.mchip{flex:none;height:26px;padding:0 10px;border-radius:20px;font-size:12px;font-weight:500;background:var(--tint-lav);color:var(--lav);white-space:nowrap;transition:all .2s}
.mchip:hover{filter:brightness(1.12)}
.mchip.due{background:var(--tint-late);color:var(--late)}
.mchip.ok{background:rgba(168,216,189,.14);color:var(--ok)}
:root[data-theme="light"] .mchip.ok{background:rgba(58,143,100,.1)}
.prog{padding:7px 2px}
.prog-t{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.prog-t b{margin-left:auto;font-family:var(--mono);font-weight:500;font-size:13px}
.prog-t em{font-style:normal;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3)}
.bar{height:6px;border-radius:6px;background:var(--panel3);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--lav))}
.mini-t{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 6px;border-radius:10px;text-align:left;font-size:13.5px;transition:background .2s}
.mini-t:hover{background:var(--panel2)}
.mini-t .sem{margin-top:7px}
.mini-t div{flex:1;min-width:0}
.mini-t small{display:block;color:var(--tx3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx{display:flex;align-items:center;gap:10px;width:100%;padding:7px 6px;border-radius:10px;font-size:13.5px;text-align:left}
.nx:hover{background:var(--panel2)}
.nx span{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--tx3)}
.p-bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:20px 0 4px}
.p-bar .inp{width:210px;height:34px}
.p-bar .sep{width:1px;height:22px;background:var(--line2)}
.tn-star{margin-left:auto;color:#b0485e;font-size:13px}
.tn-pj{font-size:11.5px;color:var(--note-tx2)}
.pj{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.pj:first-of-type{border-top:0}
.pj b{font-weight:500}
.pj small{display:block;color:var(--tx3);font-size:12px}
.pj p{margin:4px 0 0;color:var(--tx2);font-size:12.5px;line-height:1.45}
.pj-e{font-style:normal;font-size:11px;padding:2px 8px;border-radius:20px;height:fit-content;white-space:nowrap;background:var(--tint-lav);color:var(--lav)}
.pj-e.estancado{background:var(--tint-late);color:var(--late)}
.pj-e.stand{background:var(--tint-gold);color:var(--today)}
.week{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px;margin-top:18px;align-items:start}
.day{border-radius:18px;background:var(--panel);border:1px solid var(--line);padding:12px 10px 12px;min-height:180px}
.day.today{border-color:rgba(233,184,191,.55);box-shadow:0 0 0 3px var(--tint-rose)}
.day>header{display:flex;align-items:baseline;gap:6px;padding:0 4px 10px}
.day>header b{font-family:var(--serif);font-weight:500;font-size:17px}
.day>header span{font-family:var(--mono);font-size:12px;color:var(--tx3)}
.day>header em{margin-left:auto;font-style:normal;font-size:11px;color:var(--rose)}
.day .list{gap:8px}
.ev{padding:9px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.ev.bloque{background:none;border-style:dashed}
.ev.past{opacity:.6}
.ev-h{font-family:var(--mono);font-size:11.5px;color:var(--tx3)}
.ev-t{font-size:13.5px;font-weight:500;line-height:1.35;cursor:pointer;word-wrap:break-word}
.ev-t:hover{color:var(--rose)}
.ev .mchip{align-self:flex-start;height:24px;font-size:11.5px}
.ag-nav{display:flex;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
.ag-nav .lbl{font-family:var(--serif);font-size:18px;margin:0 6px}
.ag-nav small{margin-left:auto;color:var(--tx3);font-size:12.5px}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.mrow .r-title{cursor:pointer}
.mrow .btns{display:flex;gap:6px}
.hrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;cursor:pointer;transition:background .2s}
.hrow:hover{background:var(--panel)}
.hrow .r-date{width:42px}
.hrow .r-date b{font-size:15px}
.hrow small{margin-left:auto;font-size:12px;color:var(--tx3);white-space:nowrap}
.lbanner{margin-top:18px;padding:14px 18px;border-radius:16px;background:var(--tint-lav);color:var(--tx2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.lbanner b{color:var(--tx);font-weight:600}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin-top:22px}
.lcard{border-radius:18px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px 16px 12px;display:flex;flex-direction:column}
.lc-h{display:flex;align-items:flex-start;gap:10px}
.lc-h div{flex:1;min-width:0}
.lc-h b{display:block;font-weight:600;font-size:14.5px}
.lc-h small{display:block;color:var(--tx3);font-size:12.5px}
.lc-pct{font-family:var(--mono);font-size:26px;line-height:1;display:flex;align-items:center;gap:7px}
.lc-pct.verde{color:var(--ok)}.lc-pct.amarillo{color:var(--today)}.lc-pct.rojo{color:var(--late)}
.lc-f{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--tx3)}
.lc-k{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--tint-gold);font-size:12.5px;color:var(--tx2)}
.lc-k b{color:var(--today);font-weight:600}
.lc-its{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.lc-its .gab-li{padding:6px 4px;font-size:13px}
.lc-foot{display:flex;gap:6px;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.guide{margin:16px 0 4px;padding:18px 20px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);color:var(--tx2);font-size:14px;max-width:960px;animation:fade .3s var(--ease)}
.guide h4{margin:14px 0 6px;font-family:var(--serif);font-weight:500;font-size:17px;color:var(--cream)}
.guide h4:first-child{margin-top:0}
.guide ol,.guide ul{margin:0;padding-left:20px}
.guide li{margin:3px 0}
.guide b{color:var(--tx)}
/* pantalla completa: sin huecos a los lados */
.top-in,main{max-width:none;padding-left:clamp(16px,2.4vw,44px);padding-right:clamp(16px,2.4vw,44px)}
.menu{right:clamp(16px,2.4vw,44px)}
.help{max-width:none}
.hoy-grid{grid-template-columns:minmax(0,1fr) clamp(340px,24vw,440px)}
/* columnas del tablero que se minimizan */
.col-h{cursor:pointer;user-select:none;border-radius:10px;transition:background .2s}
.col-h:hover{background:var(--panel2)}
.col-h .tog{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;color:var(--tx3);font-size:12px;flex:none;transition:transform .25s var(--ease)}
.col.min .tog{transform:rotate(-90deg)}
.col.min{min-height:0;padding-bottom:8px}
.col.min .col-b,.col.min [data-rapin]{display:none}
.col.min .col-h{padding-bottom:4px}

<script>
'use strict';
// Copia limpia de esta misma página, antes de dibujar nada: sirve para "Descargar versión actual".
const SOURCE = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ================= fechas ================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const H = () => iso(new Date());
const ahora = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (s, n) => { const d = parse(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return iso(d); };
const isWk = d => d.getDay() === 0 || d.getDay() === 6;
const addBiz = (s, n) => { const d = parse(s), st = n < 0 ? -1 : 1; let k = Math.abs(n); while (k > 0) { d.setDate(d.getDate() + st); if (!isWk(d)) k--; } return iso(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const lunesDe = s => { const d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); };
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function fmt(s) {
  if (!s) return '';
  const d = diff(s, H()), dt = parse(s);
  if (d === 0) return 'Hoy';
  if (d === 1) return 'Mañana';
  if (d === -1) return 'Ayer';
  if (d > 1 && d < 7) return cap(DIAS[dt.getDay()]);
  return DIAS[dt.getDay()].slice(0, 3) + ' ' + dt.getDate() + ' ' + MES[dt.getMonth()] + (dt.getFullYear() !== new Date().getFullYear() ? ' ' + dt.getFullYear() : '');
}
const low = s => s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
const fmtTs = ts => ts ? fmt(iso(new Date(ts))) : '';
const viernes = () => { const d = new Date(); d.setDate(d.getDate() + (((5 - d.getDay() + 7) % 7) || 7)); return iso(d); };
const lunes = () => { const d = new Date(); d.setDate(d.getDate() + (((1 - d.getDay() + 7) % 7) || 7)); return iso(d); };
const finSemana = () => { const d = new Date(); d.setDate(d.getDate() + ((7 - d.getDay()) % 7)); return iso(d); };
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : b);

/* ================= tipos: quién hace qué ================= */
// "resp" fijo = el responsable del entregable ya se sabe por el tipo.
// "seg" = mi papel es dar seguimiento a otra persona (me aviso un día hábil antes).
// "espera" = después de pedirlo puedo marcarlo "esperando".
const TIPOS = {
  hacer:       { ico:'✦', label:'Yo lo hago',          resp:'Daray',   accion: () => 'Lo hago yo' },
  recordar:    { ico:'🔔', label:'Recordarle a Gabriel', resp:'Gabriel', accion: () => 'Recordarle a Gabriel' },
  gabriel:     { ico:'◆', label:'Gabriel lo hace',     resp:'Gabriel', espera:true, accion: () => 'Pendiente de Gabriel' },
  seguimiento: { ico:'↻', label:'Dar seguimiento',     ask:'¿Quién lo entrega?', seg:true, espera:true, accion: r => 'Dar seguimiento a ' + (r || '…') },
  verificar:   { ico:'◎', label:'Verificar que ocurra', ask:'¿Quién lo debe hacer?', seg:true, espera:true, accion: r => 'Verificar que ' + (r || '…') + ' cumpla' },
  escalar:     { ico:'⚑', label:'Escalar bloqueo',     ask:'¿A quién bloquea?', opcional:true, espera:true, accion: r => 'Escalar con Gabriel' + (r ? ' · bloquea a ' + r : '') },
  decision:    { ico:'◇', label:'Decisión de Gabriel', resp:'Gabriel', espera:true, accion: () => 'Monitorear decisión de Gabriel' },
};
const GAB = ['recordar', 'escalar', 'decision', 'gabriel'];
const SEG = ['seguimiento', 'verificar'];
const PERSONAS_BASE = ['Justin','Yuri','Majo','Marissa','Raúl','Josué','Jonathan','Fernando','Rubén','Daniel','Jaime','Campillo','Olivas','Nelson','Mark','David','Carel','Rafa','Rocha','Perla'];

/* ================= datos ================= */
const base = () => ({ version: 2, savedAt: 0, lastBackup: 0, items: [], reuniones: [], temas: [], elementos: [], lideres: [], semanas: [], semHechos: {}, domCong: { ids: [], ts: 0, nota: '' }, minutas: [], borrados: [], sync: {} });
const GRUPOS = [['senal', 'Señales · 17 semanas', '📍'], ['domino', 'Dominós · áreas de oportunidad', '🁢'], ['tema', 'Temas comunes · seguimiento mensual', '🗓']];
const SEMS = [['verde', 'Verde'], ['amarillo', 'Amarillo'], ['rojo', 'Rojo'], ['', 'Sin evaluar']];
const MINS = ['pendiente', 'enviada', 'no'];
const normSt = x => ({ id: x.id || uid(), fecha: x.fecha || H(), texto: String(x.texto || '').trim(), reunion: x.reunion || '' });
const normTema = (x, n) => ({
  id: x.id || uid(), grupo: GRUPOS.some(g => g[0] === x.grupo) ? x.grupo : 'tema', nombre: String(x.nombre || 'Tema').trim(),
  corto: String(x.corto || '').trim(), resp: String(x.resp || '').trim(), desc: String(x.desc || '').trim(),
  estado: ['verde', 'amarillo', 'rojo'].includes(x.estado) ? x.estado : '', orden: typeof x.orden === 'number' ? x.orden : (n || 0),
  estatus: (Array.isArray(x.estatus) ? x.estatus : []).map(normSt), destacado: !!x.destacado, upd: x.upd || 0,
  proyectos: Array.isArray(x.proyectos) ? x.proyectos : [], fuente: x.fuente || '', ficha: x.ficha || null, mon: x.mon || null,
});
let S = base();
function normItem(x) {
  const t = TIPOS[x.tipo] ? x.tipo : 'hacer';
  return {
    id: x.id || uid(), titulo: String(x.titulo || '').trim() || '(sin título)', tipo: t,
    resp: TIPOS[t].resp || String(x.resp || '').trim(),
    fecha: x.fecha || '', revisar: x.revisar || '', prio: x.prio === 'alta' ? 'alta' : '',
    estado: ['pendiente', 'esperando', 'hecho'].includes(x.estado) ? x.estado : 'pendiente',

  return out + `<div class="dom-cols"><div>${left}</div><aside class="col-side dom-side">${side}</aside></div>`;

/* ---------- Buscar ---------- */
function vBuscar() {
  const q = query.toLowerCase();
  const rs = S.reuniones.filter(r => (r.titulo + ' ' + r.notas).toLowerCase().includes(q));
  const rIds = new Set(rs.map(r => r.id));
  const res = S.items.filter(i => rIds.has(i.reunion) || [i.titulo, i.resp, i.notas, TIPOS[i.tipo].label].concat(i.avances.map(a => a.texto)).join(' ').toLowerCase().includes(q));
  let out = head(`Buscar <em>“${esc(query)}”</em>`, `${plural(res.length, 'pendiente', 'pendientes')} · ${plural(rs.length, 'reunión', 'reuniones')}`, 'buscar');
  const tms = S.temas.filter(t => [t.nombre, t.resp, t.desc].concat(t.estatus.map(s => s.texto), t.proyectos.map(p => p.nombre)).join(' ').toLowerCase().includes(q));
  if (tms.length) out += `<section class="sec"><header class="sec-h"><h3>Temas</h3><span class="cnt">${tms.length}</span></header><div class="tgrid">${tms.map(tnote).join('')}</div></section>`;
  if (rs.length) out += `<section class="sec"><header class="sec-h"><h3>Reuniones</h3><span class="cnt">${rs.length}</span></header><div class="list" style="gap:2px">${rs.slice(0, 20).map(r => { const dt = parse(r.fecha); return `<div class="hrow" data-act="abrir-r" data-r="${r.id}"><div class="r-date"><b>${dt.getDate()}</b><span>${MES[dt.getMonth()]}</span></div><div class="r-title">${esc(r.titulo)}</div></div>`; }).join('')}</div></section>`;
  const els = S.elementos.filter(e => [e.nombre, e.notas, e.miAccion, e.roles.dueno, e.roles.ejecuta, e.mon && e.mon.ctx].join(' ').toLowerCase().includes(q));
  if (els.length) out += `<section class="sec"><header class="sec-h"><h3>Elementos de dominós</h3><span class="cnt">${els.length}</span></header><div class="el-list">${els.slice(0, 40).map(e => elRow(e, 0)).join('')}</div></section>`;
  if (!res.length && !tms.length && !rs.length && !els.length) return out + `<div class="empty"><div class="big">Sin resultados</div><p>Prueba con otra palabra o el nombre de una persona.</p></div>`;
  return out + section('Abiertos', sortI(res.filter(i => i.estado !== 'hecho'))) + section('Terminados', res.filter(i => i.estado === 'hecho'));
}

let modoImport = 'reemplazar';
function importar(file) {

  rd.onload = () => {
    let d; try { d = JSON.parse(rd.result); } catch (e) { toast('Ese archivo no es un respaldo válido'); return; }
    if (Array.isArray(d)) d = { items: d };
    if (!d || (!Array.isArray(d.items) && !Array.isArray(d.reuniones))) { toast('El archivo no trae pendientes ni reuniones'); return; }
    const prev = JSON.stringify(S);
    if (modoImport === 'reemplazar') {
      if (!confirm('Esto reemplaza TODO lo que tienes ahora por el contenido del archivo. ¿Continuar?')) return;
      const lb = S.lastBackup; S = normAll(d); S.lastBackup = lb;
      toast('Respaldo cargado ✓', () => { S = normAll(JSON.parse(prev)); save(); render(); });
    } else {
      const add = normAll(d); let nr = 0, ni = 0;
      add.reuniones.forEach(r => { if (!getR(r.id)) { S.reuniones.push(r); nr++; } });
      add.items.forEach(i => { if (!get(i.id)) { S.items.push(i); ni++; } });
      toast(`Se sumaron ${ni} pendientes y ${nr} reuniones ✓`, () => { S = normAll(JSON.parse(prev)); save(); render(); });

    case 'd-addav': { const tx = $('#d-av').value.trim(); if (!tx) { $('#d-av').focus(); break; } i.avances.push(normSt({ texto: tx })); save(); render(); renderDrawer(); setTimeout(() => $('#d-av').focus(), 20); break; }
    case 'd-delav': { const a = i.avances.find(x => x.id === el.dataset.st); i.avances = i.avances.filter(x => x !== a); S.borrados.push(a.id); save(); render(); renderDrawer(); break; }
    case 'cerrar': closeDrawer(); break;
    case 'd-tipo': i.tipo = el.dataset.t; if (TIPOS[i.tipo].resp) i.resp = TIPOS[i.tipo].resp; else if (i.resp === 'Daray' || i.resp === 'Gabriel') i.resp = ''; save(); render(); renderDrawer(); break;
    case 'd-estado': setEstado(i, el.dataset.e); save(); render(); renderDrawer(); break;
    case 'd-prio': i.prio = el.dataset.p; save(); render(); renderDrawer(); break;
    case 'd-rep': i.repite = el.dataset.rp; save(); render(); renderDrawer(); break;
    case 'd-limpiar-rev': e.preventDefault(); i.revisar = ''; save(); render(); renderDrawer(); break;
    case 'd-borrar': {
      const idx = S.items.indexOf(i); S.items.splice(idx, 1); S.borrados.push(i.id); closeDrawer(); save(); render();
      toast('Eliminado', () => { S.items.splice(idx, 0, i); S.borrados = S.borrados.filter(x => x !== i.id); save(); render(); }); break;
    }
  }
  // lo que tú cambias a mano gana sobre lo que venga después en las actualizaciones
  if (i && S.items.includes(i) && JSON.stringify(i) !== antes) { i.upd = Date.now(); save(); }
});
$('#scrim').addEventListener('click', closeDrawer);
document.addEventListener('mouseover', e => { const r = e.target.closest && e.target.closest('.gx-hit'); const tip = document.querySelector('.gx-tip'); if (!tip) return;
  if (!r) { tip.hidden = true; return; } const [t0, ...ls] = r.dataset.tip.split('|'); tip.innerHTML = '<b>' + esc(t0) + '</b>' + ls.map(x => '<div>' + esc(x) + '</div>').join('');
  const w = r.closest('.gx-wrap').getBoundingClientRect(), b = r.getBoundingClientRect(); tip.style.left = Math.min(w.width - 170, Math.max(0, b.left - w.left + b.width / 2 - 80)) + 'px'; tip.hidden = false; });
// arrastrar post-its entre columnas
document.addEventListener('dragstart', e => { const n = e.target.closest && e.target.closest('.note'); if (!n) return; dragId = n.dataset.id; n.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', dragId); } catch (_) {} });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging').forEach(x => x.classList.remove('dragging')); document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('.col'); if (!c || !dragId) return; e.preventDefault(); document.querySelectorAll('.col.over').forEach(x => { if (x !== c) x.classList.remove('over'); }); c.classList.add('over'); });
document.addEventListener('drop', e => { const c = e.target.closest && e.target.closest('.col'); if (!c || !dragId) return; e.preventDefault(); c.classList.remove('over'); const id = dragId; dragId = null; moverA(id, c.dataset.col); });
// agregar rápidas escribiendo y Enter
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches || !e.target.matches('[data-rapin]')) return;
  const t = e.target.value.trim(); if (!t) return;
  S.items.push(normItem({ titulo: t, tipo: 'hacer', clase: 'rapida', upd: Date.now() })); save(); render();
  const inp = $('[data-rapin]'); if (inp) inp.focus();
});
document.addEventListener('change', e => { if (e.target.id === 'p-tema') { pTema = e.target.value; render(); } if (e.target.id === 'p-persona') { pPersona = e.target.value; render(); } });
$('#drawer').addEventListener('input', e => {
  if (e.target.dataset.tf || e.target.dataset.tfResp) { const t = getT(openTm); if (!t) return; if (e.target.dataset.tfResp) t.resp = e.target.value; else { t.ficha = Object.assign({}, t.ficha || {}); t.ficha[e.target.dataset.tf] = e.target.value; delete t.ficha.borrador; } t.upd = Date.now(); save(); return; }
  const ef = e.target.dataset.ef;
  if (ef) { const x = getE(openElId); if (!x) return; setRuta(x, ef, e.target.type === 'checkbox' ? e.target.checked : e.target.value); x.upd = Date.now(); save(); return; }
  const rf = e.target.dataset.rf;
  if (rf) { const r = getR(openRe); if (!r) return; r[rf] = e.target.value; r.upd = Date.now(); save(); if (rf !== 'notas') render(); return; }
  const f = e.target.dataset.f; if (!f) return;
  const i = get(openId); if (!i) return;
  i[f] = e.target.value; i.upd = Date.now();
  if (f === 'tema' && !i.tema && !S.borrados.includes('tema:' + i.id)) S.borrados.push('tema:' + i.id);
  save(); render();
  if (f === 'resp') { const p = $('#drawer .principle'); p.innerHTML = `<span>Entregable</span><b>${esc(i.resp || '—')}</b><span>Tu papel</span><b>${esc(TIPOS[i.tipo].accion(i.resp))}</b>`; }
});
$('#drawer').addEventListener('change', e => { if (e.target.dataset.ef && e.target.tagName !== 'TEXTAREA' && !(e.target.tagName === 'INPUT' && e.target.type === 'text')) { renderElDrawer(); render(); } if (e.target.dataset.ef === 'miAccion') renderElDrawer(); if (e.target.dataset.ef === 'nombre' || e.target.dataset.ef === 'miAccion') render(); if (['fecha', 'revisar', 'reunion', 'tema'].includes(e.target.dataset.f)) renderDrawer(); if (e.target.dataset.rf === 'fecha') render(); });
$('#drawer').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'd-av') { e.preventDefault(); $('[data-act="d-addav"]').click(); } });
$('#main').addEventListener('change', e => {
  const t = e.target, ds = t.dataset;
  if (ds.pty || ds.pe || ds.cl) { const x = getE(ds.pty || ds.pe || ds.cl); if (!x || !t.value) return; if (ds.pe) x.estado = t.value; else x.tipo = t.value; if (ds.cl && x.ia) x.ia.estado = 'descartada'; x.upd = Date.now(); save(); render();
    if (ds.pe && esHist(x)) toast('Punto cerrado ✓ · queda en el histórico'); if (ds.pty && !esPunto(x)) toast('Ya no se le da seguimiento · queda en "registros sin seguimiento"'); }
});
$('#main').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset.pt === 'titulo') { e.preventDefault(); const b = e.target.closest('[data-pa]').querySelector('[data-act="pt-add"]'); b.click(); } });
$('#main').addEventListener('input', e => {
  if (e.target.dataset.pn) { const x = getE(e.target.dataset.pn); if (x) { x.notas = e.target.value; x.upd = Date.now(); save(); } return; }
  const k = e.target.dataset.df; if (!k) return; const t = getT(domOpen); if (!t) return;
  t.ficha = Object.assign({}, t.ficha || {}); t.ficha[k] = e.target.value; t.upd = Date.now(); save();
});
$('#main').addEventListener('submit', e => {
  if (e.target.dataset.form !== 'reunion') return; e.preventDefault();
  const r = normReu({ titulo: e.target.t.value, fecha: e.target.f.value || H(), hora: e.target.h.value || '', minuta: 'pendiente', upd: Date.now() });
  S.reuniones.push(r); save(); render(); openReu(r.id); toast('Reunión registrada ✓ · pega la minuta y agrega sus pendientes');
});
$('#composer').addEventListener('input', e => {
  if (e.target.id === 'c-r') paintComposer();
  if (e.target.id === 'c-fd') { C.fecha = e.target.value; paintComposer(); }
});
$('#composer').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'date') { e.preventDefault(); saveComposer(e.ctrlKey || e.metaKey); } });
$('#minutaEd').addEventListener('input', e => {
  const m = S.minutas.find(x => x.id === mzId); if (!m) return; const k = e.target.dataset.mz, a = e.target.dataset.ma;
  if (k === 'para') m.para = mzSplit(e.target.value).map(x => { const g = x.match(/^(.*?)\s*<([^>]+)>$/); return g ? { nombre: g[1].trim(), email: g[2].trim() } : { nombre: '', email: x }; });
  else if (['resumen', 'decisiones', 'pendientes'].includes(k)) m[k] = mzSplit(e.target.value);
  else if (k) m[k] = e.target.value;
  else if (a) { const [i, c] = a.split('|'); m.acciones[+i][c] = e.target.value; } else return;
  m.upd = Date.now(); clearTimeout(mzT); mzT = setTimeout(save, 400);
});
$('#minutaEd').addEventListener('change', e => { const m = S.minutas.find(x => x.id === mzId); if (!m || !e.target.dataset.ma) return; syncMinItems(m); m.upd = Date.now(); save(); render();
  const k = e.target.dataset.ma.split('|')[0], row = document.querySelectorAll('#minutaEd .mz-row:not(.mz-hd)')[+k], a = m.acciones[+k], li = a && a.itemId && get(a.itemId), sm = row && row.querySelector('.mz-link');
  if (sm && li) { sm.className = 'mz-link' + (li.estado === 'hecho' ? ' ok' : ''); sm.dataset.act = 'mz-ver'; sm.dataset.id = li.id; sm.textContent = (li.estado === 'hecho' ? '✓ Cumplida' : li.estado === 'esperando' ? '⏳ En espera' : '🔗 En tus pendientes') + ' · ' + TIPOS[li.tipo].label + (li.fecha ? ' · ' + low(fmt(li.fecha)) : ''); } });
$('#minutaEd').addEventListener('click', e => { if (e.target.id === 'minutaEd') closeMinEd(); });
$('#fileIn').addEventListener('change', e => { if (e.target.files[0]) importar(e.target.files[0]); });
$('#q').addEventListener('input', e => { query = e.target.value.trim(); helpOpen = false; render(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && mzId) { closeMinEd(); return; }
  if (e.key === 'Escape') { if (!$('#composer').hidden) closeComposer(); else if (openId || openTm || openRe || openElId) closeDrawer(); else if (!$('#menu').hidden) $('#menu').hidden = true; else if (query) { query = ''; $('#q').value = ''; $('#q').blur(); render(); } return; }
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openComposer(); }
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
});
// Si la página queda abierta, que "Inicio" se actualice solo (cambio de día y la reunión en curso).
let ultimoDia = H(), ultimaHora = ahora().slice(0, 4);
setInterval(() => { const d = H(), hm = ahora(); if (d !== ultimoDia || (view === 'inicio' && hm.slice(0, 4) !== ultimaHora && !openId && !openTm && !openRe && !openElId && $('#composer').hidden && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))) { ultimoDia = d; ultimaHora = hm.slice(0, 4); render(); } }, 60000);

load();
setTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
render();
</script>
